# Giống rewrites trong vercel.json: /api và /login/oauth2 proxy sang BE, còn lại trả index.html (SPA)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BE cho upload tới 300MB (ảnh, video, PDF mặt bằng)
    client_max_body_size 300m;

    location /api/ {
        proxy_pass http://dv-backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Trợ lý AI trả lời chậm (BE chờ RAG tới 60s)
        proxy_read_timeout 120s;
    }

    location /login/oauth2/ {
        proxy_pass http://dv-backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

   

    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
